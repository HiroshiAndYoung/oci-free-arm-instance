name: Oracle Cloud ARM Interceptor

on:
  workflow_dispatch: # 允许你手动点击运行测试
  schedule:
    - cron: '*/15 * * * *' # 每 15 分钟自动在后台帮你抢一次（安全频率，防封号）

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install oci

      - name: Run Oracle Script
        env:
          # 脚本读取你刚刚配置好的 7 个 Secrets 变量
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          # 运行项目目录下的主要 Python 脚本
          python main.py
